[workspace]
resolver = "3"
members = ["crates/core", "crates/launch", "crates/mcp", "crates/services"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/amantibrewal310/airboss"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
