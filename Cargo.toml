[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/attention", "crates/core", "crates/launch", "crates/mcp", "crates/services", "crates/sync"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/amantibrewal310/airboss"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Small release binaries for the app and its `airboss` sidecar. Cargo reads profiles only from
# the workspace root. Panics unwind, so the app can catch them in commands and threads.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
