<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airboss prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens: dark first ================= */
:root{
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --desk:#050506;
  --bg:#0f1012;          /* main surface */
  --bg-side:#0a0b0c;     /* sidebar, darkest */
  --bg-raised:#16171a;   /* panels, peek, cards */
  --bg-input:#1b1c20;
  --bg-hover:rgba(255,255,255,.045);
  --bg-sel:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.11);
  --text:#ededf0; --text-2:#9a9ca5; --text-3:#6b6e78;
  --accent:#7b7ff5; --accent-fill:#5e63e6; --accent-soft:rgba(123,127,245,.14);
  --needs:#f2555a; --needs-soft:rgba(242,85,90,.12);
  --st-todo:#8a8d96; --st-doing:#e6b450; --st-review:#4cc38a; --st-done:#7b7ff5; --st-blocked:#f08c3a;
  --repo-1:#5b9cff; --repo-2:#e66aa6; --repo-3:#3fc79a; --repo-4:#f0a04a;
  --shadow:0 16px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
  --r:6px; --r-lg:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  --desk:#e4e5e9; --bg:#ffffff; --bg-side:#f7f7f8; --bg-raised:#ffffff; --bg-input:#f3f3f5;
  --bg-hover:rgba(0,0,0,.04); --bg-sel:rgba(0,0,0,.06); --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.11);
  --text:#1b1c1f; --text-2:#62656e; --text-3:#8e919a;
  --accent:#5e63e6; --accent-fill:#5e63e6; --accent-soft:rgba(94,99,230,.1);
  --needs:#e03e44; --needs-soft:rgba(224,62,68,.09);
  --st-todo:#9a9da5; --st-doing:#d39a1d; --st-review:#2a9f68; --st-done:#5e63e6; --st-blocked:#e0751f;
  --repo-1:#2f73e0; --repo-2:#cc4386; --repo-3:#1f9e74; --repo-4:#d07a12;
  --shadow:0 16px 48px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.08);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 var(--font);letter-spacing:-.006em;color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";display:flex;flex-direction:column;overflow:hidden;cursor:default;user-select:none}
::selection{background:var(--accent-soft)}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
kbd{font:500 11px var(--font);color:var(--text-2);background:var(--bg-input);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;min-width:18px;height:18px;display:inline-grid;place-items:center}

/* ================= desk + window ================= */
.topbar{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:var(--text-2)}
.topbar .sp{flex:1}
.tb{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px}
.tb.btnish:hover,.tb.on{background:var(--bg-hover);color:var(--text)}
.tb b{color:var(--text);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--bg-input);border:1px solid var(--line)}
.seg span{padding:1px 9px;border-radius:4px;color:var(--text-2);font-size:12px}
.seg span.on{background:var(--bg-sel);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.stage{flex:1;display:grid;place-items:center;padding:4px 18px 14px;min-height:0}
.win{width:min(1320px,100%);height:min(800px,100%);display:grid;grid-template-columns:232px 1fr;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);position:relative}

/* ================= sidebar ================= */
.side{background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:0 8px}
.lights{display:flex;gap:8px;height:40px;align-items:center;padding:0 6px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.ws{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#a678f2);display:grid;place-items:center;color:#fff}
.ws b{font-weight:600;flex:1}
.iconbtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{background:var(--bg-hover);color:var(--text)}
.nav{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;color:var(--text-2);white-space:nowrap}
.nav:hover{background:var(--bg-hover);color:var(--text)}
.nav.on{background:var(--bg-sel);color:var(--text)}
.nav .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav .c{font-size:12px;color:var(--text-3)}
.nav .badge{min-width:18px;height:18px;border-radius:9px;background:var(--needs);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.sech{font-size:11.5px;font-weight:500;color:var(--text-3);padding:16px 8px 4px;display:flex;align-items:center}
.rdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.conn{margin-top:auto;padding:8px 0 10px;border-top:1px solid var(--line);position:relative}
.conn-btn{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--text-3);cursor:pointer}
.conn-btn:hover{background:var(--bg-hover);color:var(--text-2)}
.conn-btn i{width:7px;height:7px;border-radius:50%;background:var(--st-review);flex:none}
.conn-btn.warn{color:var(--st-blocked)} .conn-btn.warn i{background:var(--st-blocked)}
.conn-pop{position:absolute;left:0;bottom:44px;width:300px;background:var(--bg-raised);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:20;animation:mod2 .12s var(--ease)}
.conn-pop .ci{display:flex;gap:10px;padding:8px;border-radius:6px}
.conn-pop .ci i{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--st-review)}
.conn-pop .ci.off i{background:var(--st-blocked)}
.conn-pop .ci b{display:block;font-weight:500;font-size:12.5px}
.conn-pop .ci span{display:block;font-size:12px;color:var(--text-2);margin-top:1px}

/* ================= main ================= */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid var(--line)}
.head .title{font-weight:600}
.head .cnt{color:var(--text-3)}
.head .sp{flex:1}
.chipbtn{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-2);font-size:12px}
.chipbtn:hover{background:var(--bg-hover);color:var(--text)}
.btn{height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-input);font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--bg-sel)}
.btn.pri{background:var(--accent-fill);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn kbd{background:rgba(255,255,255,.12);border-color:transparent;color:inherit;opacity:.85}
.body{flex:1;display:flex;min-height:0}
.list{flex:1;overflow-y:auto;min-width:0;padding:6px 0 30px;scrollbar-width:thin;outline:none}
.peek{width:480px;flex:none;border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;scrollbar-width:thin;display:none}
.body.peeking .peek{display:block;animation:peekin .18s var(--ease)}
@keyframes peekin{from{opacity:0;transform:translateX(10px)}}

/* rows */
.grp{display:flex;align-items:center;gap:8px;height:34px;padding:0 18px;font-size:12px;color:var(--text-2);background:var(--bg-raised);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:-1px;position:sticky;top:-6px;z-index:2}
.grp b{color:var(--text);font-weight:500}
.row{display:flex;align-items:center;gap:10px;height:38px;padding:0 16px 0 calc(14px + var(--d,0)*22px);border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
.row:hover{background:var(--bg-hover)}
.row.sel{background:var(--bg-sel)}
.row.sel.kb::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--accent);border-radius:2px;pointer-events:none}
.row .disc{width:14px;height:14px;display:grid;place-items:center;color:var(--text-3);flex:none}
.row .disc svg{width:10px;height:10px;transition:transform .15s var(--ease)}
.row.open .disc svg{transform:rotate(90deg)}
.row .id{width:34px;flex:none;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.row .t{overflow:hidden;text-overflow:ellipsis;font-weight:500;flex:0 1 auto;min-width:96px}
.row .meta{flex-shrink:0}
.row .meta .short{display:none}
.row .rd{display:none}
.list{container-type:inline-size;container-name:list}
@container list (max-width:820px){ .row .meta .rn{display:none} .row .rd{display:flex;align-items:center} .row .when{width:32px} }
@container list (max-width:680px){ .row .meta .long{display:none} .row .meta .short{display:inline} .row .prog .pc{display:none} .row .live .lt{display:none} .row .live{padding:0 6px} }
.row.done .t{color:var(--text-2)}
.row .prog{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.row .sp{flex:1;min-width:8px}
.row .meta{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12px}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--line-2);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.pill.warn{color:var(--st-blocked);border-color:color-mix(in srgb,var(--st-blocked) 35%,transparent)}
.pill.need{color:var(--needs);border-color:color-mix(in srgb,var(--needs) 35%,transparent);background:var(--needs-soft)}
.pill.ok{color:var(--st-review);border-color:color-mix(in srgb,var(--st-review) 35%,transparent)}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none}
.av-agent{background:#4b4fc4}.av-me{background:#2c7a5a}.av-sync{background:#555a66}.av-plan{background:#8a5a2c}.av-launch{background:#3f6aa8}
.when{width:44px;text-align:right;color:var(--text-3);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--needs);flex:none}
.st{width:16px;height:16px;flex:none}
.st.pop{animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.row.enter{animation:rowin .6s var(--ease)}
@keyframes rowin{from{background:var(--accent-soft)}}
.row input.rename{flex:1;min-width:0;background:var(--bg-input);border:1px solid var(--accent);border-radius:5px;padding:3px 6px;outline:none;font-weight:500}

/* ================= peek / page ================= */
.pk-head{height:44px;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
.pk-head .crumb{color:var(--text-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-head .crumb b{color:var(--text-2);font-weight:500}
.pk{padding:20px 24px 40px}
.pk h1{font-size:21px;font-weight:600;letter-spacing:-.018em;line-height:1.25;margin-bottom:14px}
.call{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:8px;background:var(--needs-soft);border:1px solid color-mix(in srgb,var(--needs) 22%,transparent);margin-bottom:8px}
.call .k{font-size:11.5px;font-weight:600;color:var(--needs);text-transform:none}
.call .w{flex:1;min-width:0}
.call .q{color:var(--text);margin-top:2px}
.call .acts{display:flex;gap:6px;margin-top:9px}
.call.info{background:var(--bg-raised);border-color:var(--line)}
.call.info .k{color:var(--text-2)}
.props{display:grid;grid-template-columns:104px 1fr;row-gap:2px;margin:16px 0 18px;font-size:12.5px}
.props .l{color:var(--text-3);height:30px;display:flex;align-items:center}
.props .v{min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px;margin-left:-6px;border-radius:5px}
.props .v:hover{background:var(--bg-hover)}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:5px;background:var(--bg-input);border:1px solid var(--line);font-size:12px}
.tag.link{cursor:pointer}
.tag.link:hover{border-color:var(--line-2)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px}
.sec-h .sp{flex:1}
.doc{line-height:1.65;color:var(--text);font-size:13.5px}
.doc p+p{margin-top:8px}
.doc.empty{color:var(--text-3);padding:0;text-align:left}
.feed{position:relative;padding-left:4px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12.5px;color:var(--text-2)}
.ev .av{width:18px;height:18px;font-size:9px;margin-top:1px}
.ev b{color:var(--text);font-weight:500}
.ev .tm{color:var(--text-3);margin-left:auto;white-space:nowrap;padding-left:10px}
.comment{display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;color:var(--text-3);background:var(--bg-raised)}

/* live agents */
.live{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px 0 6px;border-radius:10px;font-size:11.5px;color:var(--text-2);background:var(--bg-input);border:1px solid var(--line)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--st-review);position:relative}
.live.l-run i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--st-review);animation:pulse 1.6s ease-out infinite}
.live.l-wait i{background:var(--needs)} .live.l-stop i{background:var(--text-3)}
@keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.8)}}
.thr{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg-raised)}
.thr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* plans overview */
.plans{padding:18px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;overflow-y:auto;flex:1;align-content:start}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;background:var(--bg-raised);cursor:pointer;transition:border-color .15s,transform .15s var(--ease)}
.plan:hover{border-color:var(--line-2);transform:translateY(-1px)}
.plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.plan .pct{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.plan .rowx{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);min-height:24px}
.plan .rowx .k{width:62px;color:var(--text-3)}
.plan .rowx .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.wdots{display:flex;gap:4px}.wdots b{width:18px;height:5px;border-radius:3px;background:var(--bg-input)}.wdots b.d{background:var(--st-done)}.wdots b.c{background:var(--st-doing)}
/* menus */
.ctx{position:fixed;z-index:70;min-width:220px;background:var(--bg-raised);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);padding:5px;animation:mod2 .1s var(--ease)}
.ctx .o{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:6px}
.ctx .o:hover,.ctx .o.hl{background:var(--bg-sel)}
.ctx .o .t{flex:1}
.ctx .o .k{color:var(--text-3);font-size:11.5px}
.ctx hr{border:0;height:1px;background:var(--line);margin:4px 2px}
.ctx .o.danger .t{color:var(--text)}
.stbtn{display:grid;place-items:center;border-radius:5px;cursor:pointer}
.stbtn:hover{background:var(--bg-hover);box-shadow:0 0 0 3px var(--bg-hover)}
/* progress */
.ring{flex:none}
.ring .fg{transition:stroke-dasharray .4s var(--ease)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bg-input);flex:1;min-width:80px}
.bar i{display:block;height:100%;transition:width .4s var(--ease)}
.bar i+i{box-shadow:-1px 0 0 var(--bg)}
.pbig{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.pbig .pct{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:58px}
.pbig .bar{height:8px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--text-2);margin:-6px 0 12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px}
/* waves (compact list) */
.wv{margin-bottom:10px}
.wv-h{font-size:11.5px;color:var(--text-3);font-weight:500;margin:10px 0 4px;display:flex;gap:6px}
.sub{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;margin:0 -8px;border-radius:6px}
.sub:hover{background:var(--bg-hover)}
.sub .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub.wait .t{color:var(--text-2)}

/* page (full) */
.page{flex:1;display:grid;grid-template-columns:1fr 280px;min-height:0}
.page .content{overflow-y:auto;scrollbar-width:thin}
.page .content .pk{max-width:860px;margin:0 auto;padding:30px 40px 60px}
.page .content h1{font-size:26px}
.page aside{border-left:1px solid var(--line);padding:16px 18px;overflow-y:auto;background:var(--bg)}
.page aside .props{grid-template-columns:86px 1fr;margin-top:4px}

/* run order diagram */
.ro{position:relative}
.ro svg{position:absolute;inset:0;overflow:visible}
.ro-colh{position:absolute;top:0;font-size:11.5px;font-weight:500;color:var(--text-3)}
.lane{position:absolute;left:0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2)}
.ro-st{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--bg);z-index:2;cursor:pointer}
.stop{position:absolute;z-index:1;cursor:pointer;padding:2px 4px;margin-left:-4px;border-radius:5px}
.stop:hover{background:var(--bg-hover)}
.stop b{display:block;font-weight:500;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop.wait b{color:var(--text-2)}
.stop.sel{background:var(--accent-soft)}
.ro svg path{transition:opacity .15s}
.ro.focusing svg path:not(.hl){opacity:.18}
.ro svg path.hl{stroke-width:2.5}

/* needs me inbox */
.inbox{width:420px;flex:none;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:thin;outline:none}

const rdot=r=>r?`<span class="rdot" style="--c:${REPOS[r]}"></span>`:"";
const av=w=>`<span class="av av-${w}" title="${w}">${{agent:"A",me:"Y",sync:"S",plan:"P",launch:"L"}[w]||"?"}</span>`;

/* repos are optional tags: a task's own, or for a parent the union of its subtasks' */
function reposOf(t){ if(t.repos.length) return t.repos; const u=new Set(); const walk=p=>kids(p).forEach(k=>{T[k].repos.forEach(r=>u.add(r)); walk(k);}); walk(t.id); return [...u]; }
const rdots=rs=>rs.map(r=>rdot(r)).join("");
/* progress: share of leaf subtasks (any depth) that are done; dropped ones don't count */
function progress(id){
  const c={done:0,in_review:0,doing:0,blocked:0,todo:0,total:0};
  const walk=p=>kids(p).forEach(k=>{const t=T[k]; if(t.status==="dropped") return; if(kids(k).length) walk(k); else {c.total++; c[t.status==="proposed"?"todo":t.status]++;}});
  walk(id); c.pct=c.total?Math.round(c.done/c.total*100):0; return c;
}
function ring(pct,size=14){const r=size/2-1.6,C=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="2"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct===100?"var(--st-review)":"var(--st-done)"}" stroke-width="2" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}
const SEG=[["done","var(--st-done)","Done"],["in_review","var(--st-review)","In review"],["doing","var(--st-doing)","In progress"],["blocked","var(--st-blocked)","Blocked"]];
function bar(c){return `<span class="bar">${SEG.map(([k,col])=>c[k]?`<i style="width:${c[k]/c.total*100}%;background:${col}"></i>`:"").join("")}</span>`;}
const ancestors=id=>{const a=[];let p=T[id]?.parent;while(p!=null){a.push(p);p=T[p].parent;}return a;};
function toast(m){const e=document.createElement("div");e.className="toast";e.innerHTML=ic("spark",14)+`<span>${m}</span>`;$("#toasts").appendChild(e);setTimeout(()=>e.remove(),2800);}

/* =========================================================== list view */
function filterFn(){
  if(filter==="ready") return t=>t.status==="todo"&&!waitingOn(t).length&&!kids(t.id).length;
  if(filter==="prog") return t=>t.status==="doing"||t.status==="in_review";
  if(filter.startsWith("r:")) {const r=filter.slice(2); return t=>reposOf(t).includes(r);}
  return null;
}
function rows(){
  const out=[];
  if(filter.startsWith("p")){ const p=+filter.slice(1); const walk=(pid,d)=>{for(const id of kids(pid)){out.push([id,d]); if(T[id].open) walk(id,d+1);}}; walk(p,0); return out; }
  const f=filterFn();
  if(f){ return Object.values(T).filter(f).filter(t=>t.status!=="dropped").map(t=>[t.id,0]); }
  const walk=(pid,d)=>{for(const id of kids(pid)){const t=T[id]; if(t.status==="dropped") continue; out.push([id,d]); if(t.open&&kids(id).length) walk(id,d+1);}}; walk(null,0); return out;
}
function listTitle(){
  if(filter==="ready") return "Ready to start"; if(filter==="prog") return "In progress";
  if(filter.startsWith("r:")) return filter.slice(2); if(filter.startsWith("p")) return T[+filter.slice(1)].title; return "All tasks";
}
function rowHtml(id,d){
  const t=T[id],k=kids(id),g=gk(t),w=waitingOn(t),s=sel===id;
  const cls=["row"]; if(t.open)cls.push("open"); if(s)cls.push("sel"); if(s&&kbFocus==="list")cls.push("kb"); if(t.status==="done")cls.push("done");
  const title=renaming===id?`<input class="rename" id="rn" value="${esc(t.title)}">`:`<span class="t">${esc(t.title)}</span>`;
  const pr=k.length?progress(id):null; const prog=pr?`<span class="prog" title="${pr.pct}% done">${ring(pr.pct,13)}<span class="pc">${pr.done}/${pr.total}</span></span>`:"";
  let meta="";
  if(t.status==="blocked") meta+=`<span class="pill warn">Blocked</span>`;
  if(g==="waiting") meta+=`<span class="pill" title="waits on ${w.join(", ")}">${ic("dep",12)}<span class="long">waits on ${w.join(", ")}</span><span class="short">${w.length}</span></span>`;
  if(t.status==="todo"&&!w.length&&!k.length&&needsFor(id).some(n=>n.kind==="play")) meta+=`<span class="pill ok">Ready</span>`;
  const repos=reposOf(t);
  meta+=repos.slice(0,2).map(r=>`<span class="pill rn">${rdot(r)}${r}</span>`).join("")+(repos.length>2?`<span class="pill rn">+${repos.length-2}</span>`:"");
  const lv=LIVE[id]; const live=lv&&isOpen(t.status)?`<span class="live l-${lv[0]}" title="${esc(lv[2])}"><i></i><span class="lt">${{run:"Agent working",wait:"Waiting on you",stop:"Stopped"}[lv[0]]}</span></span>`:"";
  return `<div class="${cls.join(" ")}" data-id="${id}" style="--d:${d}">${k.length?`<span class="disc" data-disc="${id}"><svg viewBox="0 0 12 12" class="i">${I.chev}</svg></span>`:'<span class="disc"></span>'}<span class="stbtn" data-stp="${id}" title="Change status (S)">${st(g)}</span><span class="id">${id}</span>${title}${prog}${live}${needsFor(id).length?'<span class="dot" title="Needs you"></span>':""}<span class="sp"></span><span class="meta">${meta}</span>${repos.map(r=>`<span class="rd" title="${r}">${rdot(r)}</span>`).join("")}${av(t.by)}<span class="when">${t.updated}</span></div>`;
}
function renderList(flash){
  const r=rows();
  const body=r.length?r.map(([id,d])=>rowHtml(id,d)).join(""):`<div class="empty">${ic("check",22)}<h2>Nothing here</h2><div>No tasks match this view.</div></div>`;
  const pk = peek&&sel&&T[sel];

function byStatus(r){

function wireList(){

  <div class="l">Repos</div><div class="v">${repos.map(r=>`<span class="tag">${rdot(r)}${r}</span>`).join("")}${!t.repos.length&&k.length&&repos.length?'<span class="faint">· from subtasks</span>':""}<span class="tag link" data-linkrepo="${t.id}" style="color:var(--text-2)">${ic("link",12)}${repos.length?"Link repo":"Link a repo"}</span></div>

function subtasksHtml(t,wide){

/* =========================================================== run order (waves + map) */
function waves(pid){
  const ids=kids(pid).filter(c=>T[c].status!=="dropped"), set=new Set(ids), wave={};
  const inside=id=>T[id].waits.filter(w=>set.has(w));
  let left=[...ids],g=0; while(left.length&&g++<60){const r=left.filter(id=>inside(id).every(w=>wave[w]!=null)); r.forEach(id=>wave[id]=Math.max(0,...inside(id).map(w=>wave[w]+1))); left=left.filter(id=>wave[id]==null);}

  let max=Math.max(0,...Object.values(wave)); ids.forEach(id=>{if(outside(id).length) wave[id]=Math.max(wave[id],max);});

function runMap(pid){

  const slot={},used={}; ids.forEach(id=>{slot[id]=used[wave[id]]=(used[wave[id]]??-1)+1;});

  let svg=""; for(let i=1;i<count;i++){const x=i*CW; svg+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)"/>`;}

    T[id].waits.filter(w=>ids.includes(w)).forEach(w=>{const [ax,ay]=pos(w),dn=!isOpen(T[w].status),a2=ax+9;
      const skip=wave[id]-wave[w]>1, ch=Math.max(ay,by)+62;
      const d=skip?`M${a2} ${ay} H${ax+CW-46} C${ax+CW-24} ${ay} ${ax+CW-30} ${ch} ${ax+CW-8} ${ch} H${bx-46} C${bx-24} ${ch} ${bx-30} ${by} ${bx-9} ${by}`

      svg+=`<path data-f="${w}" data-t="${id}" d="${d}" fill="none" stroke="${dn?"var(--text-3)":"var(--text-2)"}" stroke-width="1.75" stroke-linecap="round" ${dn?"":'stroke-dasharray="2 5"'}/>`;});
    outside(id).forEach(o=>{svg+=`<path data-f="${o}" data-t="${id}" d="M${bx-52} ${by} H${bx-9}" fill="none" stroke="var(--text-3)" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 5"/>`;});
  });
  const heads=Array.from({length:count},(_,i)=>`<div class="ro-colh" style="left:${i*CW+6}px">Wave ${i+1}</div>`).join("");
  const stops=ids.map(id=>{const t=T[id],[x,yy]=pos(id),g=gk(t),w=waitingOn(t),o=outside(id);
    let sub=g==="waiting"?`waits on ${w.join(", ")}`:LABEL[t.status].toLowerCase(); if(o.length) sub=`waits outside: ${o.join(", ")}`;
    if(t.status==="blocked") sub=`<span style="color:var(--st-blocked)">blocked</span>`; if(t.status==="todo"&&!w.length) sub=`<span style="color:var(--st-review)">ready</span>`;
    return `<div class="ro-st" data-st="${id}" style="left:${x-8}px;top:${yy-8}px">${st(g)}</div><div class="stop${g==="waiting"?" wait":""}${roFocus===id?" sel":""}" data-st="${id}" style="left:${x-8}px;top:${yy+11}px;width:${CW-14}px"><b>${esc(t.title)}</b><small>${id} · ${sub}${t.repos.length?" · "+rdots(t.repos):""}</small></div>`;}).join("");
  return `<div class="ro" id="ro" style="width:${W}px;height:${H}px">${heads}<svg width="${W}" height="${H}">${svg}</svg>${stops}</div><div class="faint" style="display:flex;gap:16px;font-size:11.5px;margin-top:4px"><span>— done, can follow</span><span>┄ still waiting</span><span>Hover a task to trace its lines · double-click to open</span></div>`;

  <textarea class="desc" id="qaD" placeholder="Add notes, or paste a Slack link…">${esc(qa.desc)}</textarea>
  <div class="pills"><span class="pp set">${st("todo")}Todo</span>
   <span class="pp${qa.repos.length?" set":""}${qa.dd==="repo"?" focus":""}" id="ppRepo">${qa.repos.length?rdots(qa.repos):ic("repo",13)}${qa.repos.length?qa.repos.join(", "):"Repos"}${ddHtml("repo")}</span>
   <span class="pp${qa.parent?" set":""}${qa.dd==="parent"?" focus":""}" id="ppParent">${ic("tree",13)}${qa.parent?qa.parent+" "+esc(T[qa.parent].title):"Parent"}${ddHtml("parent")}</span>
   ${qa.slack?`<span class="pp set">${ic("slack",13)}Slack · ${esc(qa.slack)}<span id="slx" style="display:flex;color:var(--text-3)">${ic("x",11)}</span></span>`:""}</div>
  <div class="ft"><span><kbd>⇥</kbd> repos</span><span><kbd>⇧</kbd><kbd>⇥</kbd> parent</span><span class="sp"></span><span><kbd>⌘</kbd><kbd>↩</kbd> create and Do it</span><button class="btn pri" id="qaGo">Create task <kbd>↩</kbd></button></div>`;
  const tI=$("#qaT"), dI=$("#qaD");
  tI.oninput=()=>qa.title=tI.value; dI.oninput=()=>qa.desc=dI.value;
  const paste=e=>{const txt=(e.clipboardData||window.clipboardData).getData("text"); const m=txt.match(/https?:\/\/[\w.-]*slack\.com\/\S+/); if(m){e.preventDefault(); const ch=(m[0].match(/archives\/(\w+)/)||[])[1]; qa.slack=ch?"#"+ch.toLowerCase().slice(0,10):"thread"; const rest=txt.replace(m[0],"").trim(); if(rest&&!qa.title) qa.title=rest; renderQA(); $("#qaT").focus(); toast("Slack link attached. The agent reads the thread.");}};
  tI.onpaste=paste; dI.onpaste=paste;
  tI.onkeydown=dI.onkeydown=qaKey;
  $("#ppRepo").onclick=e=>{if(e.target.closest(".dd"))return; qa.dd=qa.dd==="repo"?null:"repo"; qa.q="";qa.hl=0; renderQA();};
  $("#ppParent").onclick=e=>{if(e.target.closest(".dd"))return; qa.dd=qa.dd==="parent"?null:"parent"; qa.q="";qa.hl=0; renderQA();};
  $("#qaGo").onclick=()=>createFromQA(false);
  const sx=$("#slx"); if(sx) sx.onclick=e=>{e.stopPropagation(); qa.slack=null; renderQA();};
  const dd=$("#ddIn"); if(dd){dd.focus(); dd.setSelectionRange(dd.value.length,dd.value.length); dd.oninput=()=>{qa.q=dd.value;qa.hl=0;renderQA();}; dd.onkeydown=qaKey; document.querySelectorAll(".dd .o").forEach(o=>o.onclick=ev=>{ev.stopPropagation(); pickDD(o.dataset.o);});}
}
function pickDD(o){ if(qa.dd==="repo"){ qa.repos=qa.repos.includes(o)?qa.repos.filter(x=>x!==o):[...qa.repos,o]; renderQA(); return; } qa.parent=o==="Top level"?null:+o; qa.dd=null; renderQA(); $("#qaT").focus(); }
function qaKey(e){
  e.stopPropagation();
  if(e.key==="Escape"){e.preventDefault(); if(qa.dd){qa.dd=null;renderQA();$("#qaT").focus();} else closeQA(); return;}
  if(e.key==="Tab"){e.preventDefault(); const k=e.shiftKey?"parent":"repo"; qa.dd=qa.dd===k?null:k; qa.q="";qa.hl=0; renderQA(); if(!qa.dd)$("#qaT").focus(); return;}
  if(qa.dd&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault(); qa.hl=(qa.hl+(e.key==="ArrowDown"?1:-1)+qa.opts.length)%qa.opts.length; renderQA(); return;}
  if(e.key==="Enter"&&qa.dd){e.preventDefault(); if(qa.opts[qa.hl]) pickDD(qa.opts[qa.hl]); return;}
  if(e.key==="Enter"&&(e.target.id==="qaT"||e.metaKey||e.ctrlKey)){e.preventDefault(); createFromQA(e.metaKey||e.ctrlKey);}
}
function createFromQA(go){
  const title=(qa.title||"").trim(); if(!title){toast("Give the task a title"); $("#qaT").focus(); return;}
  const x={notes:qa.desc}; if(qa.slack) x.links=[["slack",qa.slack]];
  const id=addTask(title,qa.parent,qa.repos,"me",x); const p=qa.parent; closeQA(); if(p!=null) T[p].open=true;
  toast(`Created <b>${id}</b> ${esc(title)}`);
  if(view!=="list"){view="list";filter="all";}
  sel=id; peek=true; renderAll(); const r=document.querySelector(`.row[data-id="${id}"]`); if(r){r.classList.add("enter"); r.scrollIntoView({block:"nearest"});}
  if(go) doIt(id);
}

/* =========================================================== palette */
let palItems=[],palHl=0;
const CMDS=[["Go to Needs me","G N",()=>openNeeds()],["Go to Plans","G L",()=>openPlans()],["Go to Ready to start","G R",()=>openList("ready")],["Go to All tasks","G A",()=>openList("all")],["New task","C",()=>openQA()],["Do it","⌘ ↩",()=>sel&&doIt(sel)],["Plan it","⇧ ⌘ ↩",()=>sel&&planIt(sel)],["Switch theme","",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")],["Keyboard shortcuts","?",()=>openSheet()]];
function openPal(){$("#palS").classList.add("open"); const i=$("#palIn"); i.value=""; palHl=0; renderPal(); i.focus();}
function closePal(){$("#palS").classList.remove("open");}
function fz(q,s){q=q.toLowerCase();s=s.toLowerCase(); if(s.includes(q)) return 2; let i=0; for(const c of s) if(c===q[i]) i++; return i===q.length?1:0;}
function renderPal(){
  const q=$("#palIn").value.trim();
  const ts=Object.values(T).filter(t=>t.status!=="dropped").map(t=>({t,s:q?fz(q,t.id+" "+t.title):(isOpen(t.status)?1:0)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,q?8:5);
  const cs=CMDS.filter(c=>!q||fz(q,c[0])).slice(0,q?5:4);
  palItems=[...ts.map(x=>({task:x.t.id})),...cs.map(c=>({c}))]; palHl=Math.min(palHl,Math.max(0,palItems.length-1));
  let i=0,h="";
  if(ts.length) h+=`<div class="grp-l">${q?"Tasks":"Jump to"}</div>`+ts.map(x=>`<div class="it${i++===palHl?" hl":""}" data-i="${i-1}">${st(gk(x.t))}<span class="num" style="width:30px">${x.t.id}</span><span class="t">${esc(x.t.title)}</span>${rdots(reposOf(x.t))}</div>`).join("");
  if(cs.length) h+=`<div class="grp-l">Commands</div>`+cs.map(c=>`<div class="it${i++===palHl?" hl":""}" data-i="${i-1}">${ic("cmd",15)}<span class="t">${c[0]}</span>${c[1]?c[1].split(" ").map(k=>`<kbd>${k}</kbd>`).join(""):""}</div>`).join("");
  $("#palRes").innerHTML=h||`<div class="empty" style="padding:24px">No match. <kbd>↩</kbd> creates “${esc(q)}” as a new task.</div>`;
  $("#palRes").querySelectorAll("[data-i]").forEach(e=>e.onclick=()=>{palHl=+e.dataset.i; runPal();});
}
function runPal(){const it=palItems[palHl], q=$("#palIn").value.trim(); closePal(); if(!it){ if(q){const id=addTask(q,null,null); selectTask(id,true); toast(`Created <b>${id}</b>`);} return;} if(it.task) selectTask(it.task,true); else it.c[2]();}
$("#palIn").addEventListener("input",()=>{palHl=0;renderPal();});
$("#palIn").addEventListener("keydown",e=>{e.stopPropagation(); if(e.key==="Escape")closePal(); if(e.key==="ArrowDown"){e.preventDefault();palHl=Math.min(palHl+1,palItems.length-1);renderPal();} if(e.key==="ArrowUp"){e.preventDefault();palHl=Math.max(palHl-1,0);renderPal();} if(e.key==="Enter"){e.preventDefault();runPal();}});

/* =========================================================== shortcuts sheet + tray */
function openSheet(){
  const K=[["Needs me","G N"],["Ready to start","G R"],["All tasks","G A"],["Jump to task","⌘ K"],["New task","C"],["Quick add from any app","⌃ ⌥ Space"],["Do it","⌘ ↩"],["Plan it","⇧ ⌘ ↩"],["Move","↑ ↓"],["Open / fold","→ ←"],["Mark done","Space"],["Change status","S"],["Link repos","R"],["Plans","G L"],["Rename","↩"],["Open full page","⌘ ↓"],["Close page / peek","Esc"],["Open thread or PR","⌘ O"],["Add waits-on","⌘ D"],["Add link","⌘ L"],["Mark blocked","⌘ B"],["Needs me: main action","↩"],["Needs me: dismiss","⌘ ⌫"],["Switch list / detail","Tab"],["This sheet","?"]];
  $("#sheet").innerHTML=`<h2>Keyboard shortcuts</h2><div class="cols">${K.map(k=>`<div class="k"><span>${k[0]}</span><span>${k[1].split(" ").map(x=>`<kbd>${x}</kbd>`).join("")}</span></div>`).join("")}</div><div class="faint" style="font-size:12px;margin-top:12px">Every shortcut also lives in the Task and View menus. Esc closes.</div>`;
  $("#shS").classList.add("open");
}
function renderTray(){
  $("#tray").innerHTML=`<div class="h"><span>Needs me</span><span>${NEEDS.length||""}</span></div>${NEEDS.length?NEEDS.slice(0,6).map(n=>`<div class="mi" data-n="${n.id}"><span style="color:var(--needs)">${ic(n.kind,14)}</span><span class="num">${n.task}</span><span class="t">${esc(n.l2)}</span><span class="faint" style="font-size:11.5px">${n.tm}</span></div>`).join(""):'<div class="mi"><span class="t muted">Nothing needs you</span></div>'}<hr><div class="mi" data-o="1">${ic("inbox",14)}<span class="t">Open Airboss</span><kbd>⌘</kbd><kbd>0</kbd></div><div class="mi" data-q="1">${ic("edit",14)}<span class="t">Quick add…</span><kbd>⌃</kbd><kbd>⌥</kbd><kbd>Space</kbd></div>`;
  $("#tray").querySelectorAll("[data-n]").forEach(e=>e.onclick=()=>{closeTray(); view="needs"; page=false; needSel=NEEDS.findIndex(n=>n.id===e.dataset.n); renderAll();});
  $("#tray").querySelector("[data-o]").onclick=()=>{closeTray(); openNeeds();};
  $("#tray").querySelector("[data-q]").onclick=()=>{closeTray(); openQA();};
}
function closeTray(){$("#tray").classList.remove("open"); $("#trayBtn").classList.remove("on");}
$("#trayBtn").onclick=e=>{e.stopPropagation(); const o=!$("#tray").classList.contains("open"); renderTray(); $("#tray").classList.toggle("open",o); $("#trayBtn").classList.toggle("on",o);};
document.addEventListener("click",e=>{if(!e.target.closest("#tray")) closeTray();});
["palS","qaS","shS"].forEach(id=>$("#"+id).addEventListener("mousedown",e=>{if(e.target.id===id){$("#"+id).classList.remove("open"); if(id==="qaS") qa=null;}}));

/* =========================================================== theme */
function setTheme(t){document.documentElement.dataset.theme=t; document.querySelectorAll("#themeSeg span").forEach(s=>s.classList.toggle("on",s.dataset.t===t)); try{localStorage.setItem("ab-theme",t);}catch(_){}; renderAll();}
document.querySelectorAll("#themeSeg span").forEach(s=>s.onclick=()=>setTheme(s.dataset.t));
try{const t=localStorage.getItem("ab-theme"); if(t) document.documentElement.dataset.theme=t, document.querySelectorAll("#themeSeg span").forEach(s=>s.classList.toggle("on",s.dataset.t===t));}catch(_){}

/* =========================================================== keyboard */
document.addEventListener("keydown",e=>{
  if($("#palS").classList.contains("open")||$("#qaS").classList.contains("open")) return;
  if($("#shS").classList.contains("open")){ if(e.key==="Escape"||e.key==="?") $("#shS").classList.remove("open"); return; }
  if(renaming||e.target.closest?.("input,textarea")) return;
  const m=e.metaKey||e.ctrlKey,k=e.key;
  if(gPending){ gPending=false; if(k==="n")return openNeeds(); if(k==="l")return openPlans(); if(k==="r")return openList("ready"); if(k==="a")return openList("all"); if(k==="p")return openList("prog"); }
  if(m&&k.toLowerCase()==="k"){e.preventDefault();openPal();return;}
  if((!m&&!e.altKey&&k==="c")||(e.altKey&&e.code==="KeyN")||(e.ctrlKey&&e.altKey&&e.code==="Space")){e.preventDefault();openQA();return;}
  if(!m&&k==="g"){gPending=true; setTimeout(()=>gPending=false,900); return;}
  if(m&&k==="0"){e.preventDefault();openNeeds();return;}
  if(k==="?"){openSheet();return;}
  if(m&&k==="Enter"){e.preventDefault(); if(view==="needs"){const n=NEEDS[needSel]; if(n) act(n.acts.find(a=>a[2])[1],n);} else if(sel) (e.shiftKey?planIt:doIt)(sel); return;}
  if(k==="Escape"){ if(page){closePage();return;} if(roFocus){roFocus=null;renderAll();return;} if(peek&&sel){peek=false;renderAll();return;} return; }
  if(m&&k==="ArrowDown"&&view==="list"&&sel){e.preventDefault(); openPage(sel); return;}
  if(m&&k==="ArrowUp"&&page){e.preventDefault(); closePage(); return;}
  if(m&&k.toLowerCase()==="o"){e.preventDefault(); toast("Opens the latest thread or PR"); return;}
  if(m&&k.toLowerCase()==="d"&&sel){e.preventDefault(); toast(`Pick the task ${sel} waits on (⌘K picker)`); return;}
  if(m&&k.toLowerCase()==="l"&&sel){e.preventDefault(); const u=prompt("Paste a link (thread, PR, Slack, doc)"); if(u){T[sel].links.push([/slack/.test(u)?"slack":/pull/.test(u)?"pr":"doc",u.replace(/^https?:\/\//,"").slice(0,40)]); renderAll(); toast("Link added");} return;}
  if(m&&k.toLowerCase()==="b"&&sel){e.preventDefault(); setStatus(sel,"blocked"); return;}
  if(k==="Tab"&&view==="list"&&sel&&peek){e.preventDefault(); kbFocus=kbFocus==="list"?"peek":"list"; renderAll(); if(kbFocus==="peek") document.querySelector("#peek .btn.pri, #peek button")?.focus(); return;}
  if(view==="needs"){
    if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault(); kbFocus="list"; needSel=Math.max(0,Math.min(NEEDS.length-1,needSel+(k==="ArrowDown"?1:-1))); renderNeeds(); return;}
    if(k==="Enter"){e.preventDefault(); const n=NEEDS[needSel]; if(n) act(n.acts.find(a=>a[2])[1],n); return;}
    if(m&&k==="Backspace"){e.preventDefault(); const n=NEEDS[needSel]; if(n) removeNeed(n,"Dismissed"); return;}
    return;
  }
  if(view==="plans"){ const n=document.querySelectorAll("[data-plan]").length, cols=Math.max(1,Math.round(($(".plans")?.clientWidth||700)/352));
    if(k==="ArrowRight"){planSel=Math.min(n-1,planSel+1);renderPlans();} if(k==="ArrowLeft"){planSel=Math.max(0,planSel-1);renderPlans();}
    if(k==="ArrowDown"){e.preventDefault();planSel=Math.min(n-1,planSel+cols);renderPlans();} if(k==="ArrowUp"){e.preventDefault();planSel=Math.max(0,planSel-cols);renderPlans();}
    if(k==="Enter"){const el=document.querySelectorAll("[data-plan]")[planSel]; if(el) openPage(+el.dataset.plan);} return; }
  if(page) return;
  const r=rows().map(x=>x[0]); let i=r.indexOf(sel);
  if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault(); kbFocus="list"; i=i<0?0:Math.max(0,Math.min(r.length-1,i+(k==="ArrowDown"?1:-1))); sel=r[i]; roFocus=null; renderAll(); return;}
  if(!sel) return; const t=T[sel];
  if(k==="ArrowRight"){e.preventDefault(); if(kids(sel).length){ if(!t.open){t.open=true;renderAll();} else {sel=kids(sel)[0];renderAll();} } return;}
  if(k==="ArrowLeft"){e.preventDefault(); if(t.open&&kids(sel).length){t.open=false;renderAll();} else if(t.parent!=null&&r.includes(t.parent)){sel=t.parent;renderAll();} return;}
  if(k===" "){e.preventDefault(); toggleDone(sel); return;}
  if(k==="r"&&!m&&sel){e.preventDefault(); const r=document.querySelector(`.row[data-id="${sel}"]`)?.getBoundingClientRect(); if(r) repoMenu(r.left+60,r.bottom,sel); return;}
  if(k==="s"&&!m){e.preventDefault(); const b=document.querySelector(`.row[data-id="${sel}"] .stbtn`); if(b){const r=b.getBoundingClientRect(); statusMenu(r.left,r.bottom+4,sel);} return;}
  if(k==="Enter"){e.preventDefault(); renaming=sel; renderAll(); return;}
});

/* =========================================================== render */
function renderAll(){ renderSide(); if(view==="plans") renderPlans(); else if(view==="needs") renderNeeds(); else if(page&&sel) renderPage(); else renderList(); }
window.addEventListener("resize",()=>{ if(page) renderPage(); });
renderAll();
</script>
