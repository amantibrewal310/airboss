[package]
name = "airboss-mcp"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The airboss binary: a per-thread MCP server for agents, and a small CLI for me."

[[bin]]
name = "airboss"
path = "src/main.rs"

[dependencies]
airboss-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "io-std"] }
serde_json = "1.0.154"
clap = { version = "4.6.10", features = ["derive"] }

[lints]
workspace = true
