[package]
name = "airboss-sync"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Live state for Airboss: GitHub PRs through gh, T3 threads from T3's database, Claude Code sessions, Herdr terminals."

[features]
# Fake sources (gh, T3, Claude, Herdr, the watcher) and a settable clock, for tests.
fakes = ["airboss-services/fakes"]

[dependencies]
airboss-core = { path = "../core" }
airboss-services = { path = "../services" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
notify = { version = "9.0.0", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
# The crate's own tests use its fakes.
airboss-sync = { path = ".", features = ["fakes"] }

[lints]
workspace = true

[[example]]
name = "idle"
required-features = ["fakes"]
