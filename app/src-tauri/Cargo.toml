[package]
name = "airboss-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The Airboss Mac app: windows, menus, the view model, and the services in one process."
default-run = "airboss-app"

[lib]
name = "airboss_app"
path = "src/lib.rs"

[[bin]]
name = "airboss-app"
path = "src/main.rs"

[dependencies]
airboss-core = { path = "../../crates/core" }
airboss-services = { path = "../../crates/services" }
airboss-sync = { path = "../../crates/sync" }
airboss-launch = { path = "../../crates/launch" }
airboss-attention = { path = "../../crates/attention" }
tauri = { version = "=2.12.7", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-log = "=2.10.2"
# In-app updates: the manifest, the signed download and the bundle swap (`updates.rs`).
tauri-plugin-updater = "=2.14.1"
tauri-nspanel = "=2.1.1"
notify = { version = "=9.0.0", default-features = false, features = ["macos_kqueue"] }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
# Notifications through UNUserNotificationCenter: permission, posting, and clicks.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "=0.6.2"
# Checking the code signature of the app that opens a link (`handlers.rs`).
objc2-security = { version = "=0.3.2", default-features = false, features = ["std", "CSCommon", "SecStaticCode", "SecRequirement", "SecBase"] }
objc2-core-foundation = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
ts-rs = "=12.0.1"
# Reading `~/.codex/config.toml` (read-only) to see whether Codex has the airboss MCP server.
toml = { version = "=1.2.3", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# Tests and the fixtures recorder run on the services' fakes.
airboss-services = { path = "../../crates/services", features = ["fakes"] }
tauri = { version = "=2.12.7", features = ["tray-icon", "macos-private-api", "image-png", "test"] }
# Only to build SQLite's own errors in tests (core's version).
rusqlite = "=0.43.0"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

# The workspace forbids unsafe code; the app denies it instead, so that `src/macos.rs` alone
# can allow it (AppKit calls and the quick-add panel class).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# AppKit menus are made on the main thread only: this test runs in its own `main`.
[[test]]
name = "menu_native"
harness = false
